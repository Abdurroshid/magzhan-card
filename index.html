<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magzhan Madiyev – General Director</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 24px;
      overflow: visible;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }

    .header {
      border-radius: 24px 24px 0 0;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      background: #2d2d2d;
      position: relative;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* decorative squiggle lines */
    .header svg.squiggle {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.18;
    }

    .avatar-ring {
      position: relative;
      z-index: 1;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #fff;
      overflow: hidden;
      background: #555;
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* placeholder gradient when no real photo */
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #6b7280, #9ca3af);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    /* ── BODY ── */
    .body {
      padding: 28px 24px 32px;
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      color: #111;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      text-align: center;
      margin-top: 4px;
    }

    .org {
      font-size: 13px;
      font-weight: 400;
      color: #888;
      text-align: center;
      margin-top: 2px;
    }

    /* ── CONTACT LIST ── */
    .contacts {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f5f5f5;
      border-radius: 14px;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }

    .contact-item:hover { background: #ebebeb; }

    .contact-item.active-border {
      border: 1.5px solid #d0d0d0;
      background: #f9f9f9;
    }

    .icon-wrap {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #333;
    }

    .icon-wrap svg { width: 20px; height: 20px; }

    .contact-label {
      font-size: 10px;
      font-weight: 600;
      color: #999;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 3px;
    }

    .contact-value {
      font-size: 14px;
      font-weight: 500;
      color: #111;
    }

    .contact-info { flex: 1; }

    .external-icon {
      width: 18px;
      height: 18px;
      color: #bbb;
      flex-shrink: 0;
    }

    /* ── SOCIAL ROW ── */
    .section-label {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #bbb;
      margin-top: 28px;
      margin-bottom: 14px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .social-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      text-decoration: none;
      transition: background 0.15s;
    }

    .social-btn:hover { background: #e8e8e8; }
    .social-btn svg { width: 20px; height: 20px; }

    /* ── SAVE BUTTON ── */
    .save-wrap {
      padding: 8px 24px 28px;
      background: #fff;
      border-radius: 0 0 24px 24px;
    }

    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: #2d2d2d;
      color: #fff;
      border: none;
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      text-decoration: none;
    }

    .save-btn:hover { background: #444; }
    .save-btn:active { transform: scale(0.98); }
    .save-btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body>

<div class="card">

  <!-- Save Contact Button -->
  <div class="save-wrap">
    <a class="save-btn" href="magzhan.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

</div>




</body>
</html>
